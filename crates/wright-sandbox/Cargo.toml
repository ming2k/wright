[package]
name = "wright-sandbox"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Linux namespace, chroot, and OverlayFS sandbox execution engine for Wright (ADR-0048)"

[dependencies]
libc = "0.2"
nix = { version = "0.29", features = ["sched", "mount", "signal", "process", "hostname", "user", "fs"] }
tempfile = "3"
thiserror = "2"
tokio = { version = "1.52.1", features = ["sync", "signal", "rt", "macros"] }
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wright-model = { path = "../wright-model" }

[lints]
workspace = true
