[package]
name = "wright-state"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Persistent state and delivery recovery for Wright"

[dependencies]
chrono = "0.4"
futures-util = "0.3.32"
libc = "0.2"
rusqlite = { version = "0.31", features = ["bundled"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1.52.1", features = ["sync", "rt", "macros"] }
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1.52.1", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
