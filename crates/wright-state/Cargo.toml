[package]
name = "wright-state"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Persistent state and delivery recovery for Wright"

[dependencies]
chrono = "0.4"
futures-util = "0.3.32"
libc = "0.2"
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8.6", default-features = false, features = ["sqlite", "runtime-tokio-rustls", "macros", "migrate"] }
thiserror = "2"
tracing = "0.1"
wright-part = { path = "../wright-part" }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1.52.1", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
