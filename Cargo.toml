[workspace]
members = [
    "crates/wright-actions",
    "crates/wright-cache",
    "crates/wright-config",
    "crates/wright-ledger",
    "crates/wright-lock",
    "crates/wright-model",
    "crates/wright-part",
    "crates/wright-plan",
    "crates/wright-registry",
    "crates/wright-resolve",
    "crates/wright-sandbox",
    "crates/wright-scheduler",
]
resolver = "3"

[workspace.package]
version = "5.8.3"
edition = "2024"
license = "MIT"

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(with_handlers)'] }

[workspace.lints.clippy]
too_many_arguments = "allow"
# Console output must go through the BrokenPipe-safe outln!/out!/errln!
# macros (see wright_engine::util::output); the raw print macros panic on
# EPIPE. Test code and build.rs opt out locally.
print_stdout = "deny"
print_stderr = "deny"

[package]
name = "wright"
version.workspace = true
edition.workspace = true
description = "Declarative, extensible, sandboxed Linux package manager"
license.workspace = true

[[bin]]
name = "wright"
path = "src/bin/wright.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tokio = { version = "1.52.1", features = ["rt-multi-thread", "macros", "net"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
wright-cache = { path = "crates/wright-cache" }
wright-config = { path = "crates/wright-config" }
wright-actions = { path = "crates/wright-actions" }
wright-ledger = { path = "crates/wright-ledger" }
wright-lock = { path = "crates/wright-lock" }
wright-part = { path = "crates/wright-part" }
wright-plan = { path = "crates/wright-plan" }
wright-registry = { path = "crates/wright-registry" }
wright-resolve = { path = "crates/wright-resolve" }
wright-sandbox = { path = "crates/wright-sandbox" }
wright-scheduler = { path = "crates/wright-scheduler" }

[dev-dependencies]
libc = "0.2"
rusqlite = { version = "0.31", features = ["bundled"] }
tempfile = "3"

[build-dependencies]
clap = { version = "4", features = ["derive"] }
clap_mangen = "0.2"
clap_complete = "4"

# `with_handlers` is set by build.rs (via cargo::rustc-cfg) ONLY for the main
# crate compile, not for build.rs itself. The cfg gates command handler bodies
# in src/cli/*.rs that reference crate::operations etc. — those modules don't
# exist when build.rs `#[path]`-includes src/cli/mod.rs.
[lints]
workspace = true

[profile.dev]
opt-level = 0
debug = 1
split-debuginfo = "unpacked"

[profile.test]
opt-level = 0
debug = 1
split-debuginfo = "unpacked"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
