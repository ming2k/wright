[workspace]
members = [
    "crates/wright-engine",
    "crates/wright-model",
    "crates/wright-part",
    "crates/wright-plan",
    "crates/wright-state",
]
resolver = "3"

[workspace.package]
version = "5.6.1"
edition = "2024"
license = "MIT"

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(with_handlers)'] }

[workspace.lints.clippy]
too_many_arguments = "allow"
# Console output must go through the BrokenPipe-safe outln!/out!/errln!
# macros (see wright_engine::util::output); the raw print macros panic on
# EPIPE. Test code and build.rs opt out locally.
print_stdout = "deny"
print_stderr = "deny"

[package]
name = "wright"
version.workspace = true
edition.workspace = true
description = "Declarative, extensible, sandboxed Linux package manager"
license.workspace = true

[[bin]]
name = "wright"
path = "src/bin/wright.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tokio = { version = "1.52.1", features = ["full"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
wright-engine = { path = "crates/wright-engine" }
wright-part = { path = "crates/wright-part" }
wright-plan = { path = "crates/wright-plan" }
wright-state = { path = "crates/wright-state" }

[dev-dependencies]
sqlx = { version = "0.8.6", default-features = false, features = ["sqlite", "runtime-tokio-rustls"] }
tempfile = "3"

[build-dependencies]
clap = { version = "4", features = ["derive"] }
clap_mangen = "0.2"
clap_complete = "4"

# `with_handlers` is set by build.rs (via cargo::rustc-cfg) ONLY for the main
# crate compile, not for build.rs itself. The cfg gates command handler bodies
# in src/cli/*.rs that reference crate::operations etc. — those modules don't
# exist when build.rs `#[path]`-includes src/cli/mod.rs.
[lints]
workspace = true
